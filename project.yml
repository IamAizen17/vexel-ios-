name: Vexel
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  VexelCore:
    path: Packages/VexelCore
  VexelArchive:
    path: Packages/VexelArchive
  VexelRenderer:
    path: Packages/VexelRenderer
  VexelShaderCompiler:
    path: Packages/VexelShaderCompiler
  VexelMedia:
    path: Packages/VexelMedia
  VexelAudio:
    path: Packages/VexelAudio
  VexelExport:
    path: Packages/VexelExport
  VexelPlugins:
    path: Packages/VexelPlugins
targets:
  Vexel:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources/effects.json
    dependencies:
      - package: VexelCore
        product: VexelCore
      - package: VexelArchive
        product: VexelArchive
      - package: VexelRenderer
        product: VexelRenderer
      - package: VexelMedia
        product: VexelMedia
      - package: VexelAudio
        product: VexelAudio
      - package: VexelExport
        product: VexelExport
      - package: VexelPlugins
        product: VexelPlugins
    info:
      path: App/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ragestudios.vexel.project
            UTTypeDescription: Vexel Project
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - vexelproj
              public.mime-type:
                - application/vnd.vexel.project+zip
        CFBundleDocumentTypes:
          - CFBundleTypeName: Vexel Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.ragestudios.vexel.project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamAizen17.vexel
        PRODUCT_NAME: Vexel
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vexel
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
