name: Generate Source Android Compatibility Archive

on:
  workflow_dispatch:
  push:
    branches:
      - feat/modular-engine-architecture

permissions:
  contents: read

concurrency:
  group: source-android-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Export with reference Kotlin archive writer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected Vexel branch
        uses: actions/checkout@v4

      - name: Check out pinned Android reference source
        uses: actions/checkout@v4
        with:
          repository: IamAizen17/vexel-editor
          ref: 462bd35553f940c090b8aa89f280fc97ee31028c
          path: reference

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: reference/gradle/libs.versions.toml

      - name: Generate and verify source archive
        working-directory: reference
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --rerun-tasks :core:test --tests dev.kinesis.core.FormatTest.exportsCheckedInVideoAudioExampleAsCompatibilityArchive
          test -s build/compatibility-artifacts/kinesis-video-audio.knsproj
          unzip -t build/compatibility-artifacts/kinesis-video-audio.knsproj
          unzip -l build/compatibility-artifacts/kinesis-video-audio.knsproj

      - name: Upload generated compatibility archive
        uses: actions/upload-artifact@v4
        with:
          name: kinesis-source-generated-knsproj
          path: reference/build/compatibility-artifacts/kinesis-video-audio.knsproj
          if-no-files-found: error
          retention-days: 14

  import-into-vexel:
    name: Import generated archive with Vexel
    needs: generate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out selected Vexel branch
        uses: actions/checkout@v4

      - name: Download source-generated archive
        uses: actions/download-artifact@v4
        with:
          name: kinesis-source-generated-knsproj
          path: compatibility-artifacts

      - name: Import archive with VexelArchive
        env:
          VEXEL_SOURCE_KNSPROJ_PATH: ${{ github.workspace }}/compatibility-artifacts/kinesis-video-audio.knsproj
        run: |
          set -euo pipefail
          test -s "$VEXEL_SOURCE_KNSPROJ_PATH"
          swift test --package-path Packages/VexelArchive --filter testImportsSourceGeneratedKotlinArchive
