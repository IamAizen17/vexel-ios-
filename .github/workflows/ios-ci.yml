name: iOS Continuous Integration

on:
  pull_request:
    branches:
      - feat/port-reference-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test packages and build iOS app
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify source effect registry
        run: python3 scripts/verify_effect_registry.py

      - name: Verify engine and shader port coverage
        run: python3 scripts/verify_engine_port_status.py

      - name: Build and test Swift packages
        shell: bash
        run: |
          set -euo pipefail
          for package in Packages/*; do
            if [ -f "$package/Package.swift" ]; then
              echo "::group::Build $package"
              swift build --package-path "$package"
              if [ -d "$package/Tests" ]; then
                swift test --package-path "$package"
              fi
              echo "::endgroup::"
            fi
          done

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS simulator target
        run: |
          xcodebuild build \
            -project Vexel.xcodeproj \
            -scheme Vexel \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
